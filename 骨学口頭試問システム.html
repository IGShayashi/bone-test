<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>骨学口頭試問システム</title>
<link href="https://fonts.googleapis.com/css2?family=Noto+Serif+JP:wght@400;600;700&family=Noto+Sans+JP:wght@300;400;500&display=swap" rel="stylesheet">
<style>
  :root {
    --bg:        #f5f2eb;
    --surface:   #fffefa;
    --border:    #d6cfc0;
    --accent:    #2a5f4f;
    --accent2:   #7a4f2a;
    --text:      #1e1a14;
    --muted:     #8a7f6e;
    --highlight: #e8f4f0;
    --row-odd:   #faf8f4;
    --row-even:  #f0ede5;
    --shadow:    0 4px 24px rgba(30,26,20,0.10);
  }

  * { box-sizing: border-box; margin: 0; padding: 0; }

  body {
    background: var(--bg);
    color: var(--text);
    font-family: 'Noto Sans JP', sans-serif;
    min-height: 100vh;
    padding: 32px 16px 64px;
  }

  /* ── ヘッダー ── */
  header {
    text-align: center;
    margin-bottom: 40px;
  }
  header h1 {
    font-family: 'Noto Serif JP', serif;
    font-size: clamp(1.4rem, 4vw, 2rem);
    font-weight: 700;
    letter-spacing: 0.12em;
    color: var(--accent);
    margin-bottom: 6px;
  }
  header p {
    font-size: 0.82rem;
    color: var(--muted);
    letter-spacing: 0.05em;
  }
  .divider {
    width: 60px; height: 2px;
    background: linear-gradient(90deg, var(--accent), var(--accent2));
    margin: 14px auto 0;
    border-radius: 2px;
  }

  /* ── レイアウト ── */
  .container {
    max-width: 900px;
    margin: 0 auto;
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 28px;
    align-items: start;
  }
  @media (max-width: 680px) {
    .container { grid-template-columns: 1fr; }
  }

  /* ── カード共通 ── */
  .card {
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: 12px;
    box-shadow: var(--shadow);
    overflow: hidden;
  }
  .card-header {
    display: flex;
    align-items: center;
    gap: 10px;
    padding: 16px 20px 14px;
    border-bottom: 1px solid var(--border);
    background: linear-gradient(135deg, #f7f4ee 0%, #eee9de 100%);
  }
  .card-header .badge {
    display: inline-flex;
    align-items: center;
    justify-content: center;
    width: 28px; height: 28px;
    border-radius: 50%;
    font-size: 0.8rem;
    font-weight: 700;
    flex-shrink: 0;
  }
  .badge-green  { background: var(--accent);  color: #fff; }
  .badge-brown  { background: var(--accent2); color: #fff; }
  .card-header h2 {
    font-family: 'Noto Serif JP', serif;
    font-size: 0.95rem;
    font-weight: 600;
    letter-spacing: 0.06em;
  }
  .card-body { padding: 0; }

  /* ── データ一覧テーブル ── */
  .data-table {
    width: 100%;
    border-collapse: collapse;
    font-size: 0.78rem;
  }
  .data-table thead th {
    padding: 8px 12px;
    text-align: left;
    font-size: 0.72rem;
    font-weight: 500;
    color: var(--muted);
    letter-spacing: 0.06em;
    background: #f0ede5;
    border-bottom: 1px solid var(--border);
  }
  .data-table tbody tr:nth-child(odd)  { background: var(--row-odd); }
  .data-table tbody tr:nth-child(even) { background: var(--row-even); }
  .data-table tbody tr:hover { background: var(--highlight); }
  .data-table td {
    padding: 5px 12px;
    border-bottom: 1px solid #e8e4da;
    vertical-align: middle;
  }
  .td-num  { width: 40px; color: var(--muted); font-size: 0.7rem; text-align: right; padding-right: 8px; }
  .td-bone { font-weight: 500; color: var(--accent); }
  .td-part { color: var(--text); }

  /* スクロール領域 */
  .table-scroll { max-height: 340px; overflow-y: auto; }
  .table-scroll::-webkit-scrollbar { width: 5px; }
  .table-scroll::-webkit-scrollbar-track { background: #f0ede5; }
  .table-scroll::-webkit-scrollbar-thumb { background: var(--border); border-radius: 3px; }

  /* カテゴリタブ */
  .cat-tabs {
    display: flex;
    flex-wrap: wrap;
    gap: 6px;
    padding: 12px 16px 0;
    background: #f7f4ee;
    border-bottom: 1px solid var(--border);
  }
  .cat-tab {
    padding: 4px 12px;
    border-radius: 20px;
    font-size: 0.72rem;
    font-weight: 500;
    cursor: pointer;
    border: 1px solid var(--border);
    background: var(--surface);
    color: var(--muted);
    transition: all 0.18s;
  }
  .cat-tab.active {
    background: var(--accent);
    color: #fff;
    border-color: var(--accent);
  }
  .cat-tab:hover:not(.active) { background: var(--highlight); }

  /* ── 試験パネル（右カラム） ── */
  .exam-card {
    position: sticky;
    top: 20px;
  }

  /* ボタン */
  .btn-start {
    display: block;
    width: calc(100% - 32px);
    margin: 16px auto;
    padding: 14px 0;
    background: linear-gradient(135deg, var(--accent) 0%, #1e4a3b 100%);
    color: #fff;
    border: none;
    border-radius: 8px;
    font-family: 'Noto Serif JP', serif;
    font-size: 1rem;
    font-weight: 600;
    letter-spacing: 0.12em;
    cursor: pointer;
    box-shadow: 0 3px 12px rgba(42,95,79,0.35);
    transition: all 0.2s;
  }
  .btn-start:hover {
    transform: translateY(-1px);
    box-shadow: 0 6px 18px rgba(42,95,79,0.45);
  }
  .btn-start:active { transform: translateY(0); }

  /* 問題リスト */
  #quiz-area {
    padding: 0 16px 20px;
    min-height: 80px;
  }
  .quiz-placeholder {
    text-align: center;
    color: var(--muted);
    font-size: 0.82rem;
    padding: 24px 0 8px;
    letter-spacing: 0.04em;
  }
  .quiz-meta {
    display: flex;
    justify-content: space-between;
    align-items: center;
    font-size: 0.72rem;
    color: var(--muted);
    letter-spacing: 0.05em;
    margin-bottom: 12px;
    padding-top: 4px;
  }
  .quiz-meta .total { font-weight: 600; color: var(--accent); }

  .quiz-item {
    display: grid;
    grid-template-columns: 28px 1fr;
    gap: 8px;
    align-items: start;
    padding: 10px 10px;
    margin-bottom: 6px;
    border-radius: 8px;
    border: 1px solid transparent;
    background: var(--row-odd);
    animation: slideIn 0.3s ease both;
  }
  .quiz-item:nth-child(odd)  { background: var(--row-odd);  }
  .quiz-item:nth-child(even) { background: var(--row-even); }
  @keyframes slideIn {
    from { opacity: 0; transform: translateX(12px); }
    to   { opacity: 1; transform: translateX(0); }
  }
  .quiz-item .q-num {
    display: flex;
    align-items: center;
    justify-content: center;
    width: 22px; height: 22px;
    border-radius: 50%;
    background: var(--accent);
    color: #fff;
    font-size: 0.65rem;
    font-weight: 700;
    flex-shrink: 0;
    margin-top: 1px;
  }
  .quiz-item .q-content {
    display: flex;
    align-items: baseline;
    flex-wrap: wrap;
    gap: 0 10px;
  }
  .quiz-item .q-no {
    font-size: 0.78rem;
    font-weight: 600;
    color: var(--muted);
    white-space: nowrap;
  }
  .quiz-item .q-bone {
    font-weight: 600;
    font-size: 0.9rem;
    color: var(--accent);
    letter-spacing: 0.02em;
    white-space: nowrap;
  }
  .quiz-item .q-part {
    font-size: 0.85rem;
    color: var(--text);
    white-space: nowrap;
  }

  /* カテゴリ色バッジ */
  .cat-pill {
    display: inline-block;
    padding: 1px 7px;
    border-radius: 10px;
    font-size: 0.62rem;
    font-weight: 500;
    margin-left: 4px;

  .c1 { background: #f0e8f4; color: #5f2a5f; }
  .c2 { background: #f4f0e8; color: #5f4a2a; }
  .c3 { background: #e8ecf4; color: #2a3a5f; }
  .c4 { background: #f4ebe8; color: #5f2a2a; }

  /* ── フッター ── */
  .footer-note {
    text-align: center;
    font-size: 0.7rem;
    color: var(--muted);
    margin-top: 32px;
    letter-spacing: 0.05em;
  }
</style>

const CAT_COLORS = ["c0","c1","c2","c3","c4"];
let currentCat = 0;

// ── タブ生成 ──────────────────────────────────────────────────────
function buildTabs() {
  const tabs = document.getElementById('cat-tabs');
  CATEGORIES.forEach((cat, i) => {
    const btn = document.createElement('button');
    btn.className = 'cat-tab' + (i === 0 ? ' active' : '');
    btn.textContent = cat.name;
    btn.onclick = () => {
      document.querySelectorAll('.cat-tab').forEach(t => t.classList.remove('active'));
      btn.classList.add('active');
      currentCat = i;
      renderTable(i);
    };
    tabs.appendChild(btn);
  });
}

// ── テーブル描画 ──────────────────────────────────────────────────
function renderTable(catIdx) {
  const tbody = document.getElementById('table-body');
  tbody.innerHTML = '';
  const rows = CATEGORIES[catIdx].data;
  rows.forEach(([num, bone, part]) => {
    const tr = document.createElement('tr');
    tr.innerHTML = `
      <td class="td-num">${num}</td>
      <td class="td-bone">${bone}</td>
      <td class="td-part">${part}</td>`;
    tbody.appendChild(tr);
  });
}

// ── ランダム選択（各カテゴリ2問、重複なし） ────────────────────────
function pickRandom(arr, n) {
  const copy = [...arr];
  const result = [];
  while (result.length < n && copy.length > 0) {
    const idx = Math.floor(Math.random() * copy.length);
    result.push(copy.splice(idx, 1)[0]);
  }
  return result;
}

  CATEGORIES.forEach((cat, ci) => {
    const picked = pickRandom(cat.data, 2);
    picked.forEach(row => allPicked.push({ row, catName: cat.name, catIdx: ci }));
  });

  // 問題番号をシャッフル（カテゴリ順ではなくランダム順で表示）
  for (let i = allPicked.length - 1; i > 0; i--) {
    const j = Math.floor(Math.random() * (i + 1));
    [allPicked[i], allPicked[j]] = [allPicked[j], allPicked[i]];
  }

  // メタ行
  const meta = document.createElement('div');
  meta.className = 'quiz-meta';
  meta.innerHTML = `<span>出題リスト</span><span class="total">全 ${allPicked.length} 問</span>`;
  area.appendChild(meta);

  // 各問
  allPicked.forEach(({ row, catName, catIdx }, qIdx) => {
    const [num, bone, part] = row;
    const item = document.createElement('div');
    item.className = 'quiz-item';
    item.style.animationDelay = `${qIdx * 0.05}s`;
    item.innerHTML = `
      <div class="q-num">${qIdx + 1}</div>
      <div class="q-content">
        <span class="q-no">No.${num}</span>
        <span class="q-bone">${bone}</span>
        <span class="q-part">${part}</span>
      </div>`;
    area.appendChild(item);
  });

  // 検証：10問 / 各カテゴリ2問
  console.assert(allPicked.length === 10, "❌ 問題数が10問ではありません");
  CATEGORIES.forEach((cat, ci) => {
    const cnt = allPicked.filter(p => p.catIdx === ci).length;
    console.assert(cnt === 2, `❌ ${cat.name}: ${cnt}問（2問であるべき）`);
  });
  // 重複チェック（番号）
  const nums = allPicked.map(p => p.row[0]);
  const unique = new Set(nums);
  console.assert(unique.size === 10, "❌ 重複する問題があります");
}

// ── 初期化 ────────────────────────────────────────────────────────
buildTabs();
renderTable(0);
</script>
</body>
