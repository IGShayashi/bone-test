<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>骨学口頭試問システム</title>
<link href="https://fonts.googleapis.com/css2?family=Noto+Serif+JP:wght@400;600;700&family=Noto+Sans+JP:wght@300;400;500&display=swap" rel="stylesheet">
<style>
  :root {
    --bg:        #f5f2eb;
    --surface:   #fffefa;
    --border:    #d6cfc0;
    --accent:    #2a5f4f;
    --accent2:   #7a4f2a;
    --danger:    #b03a2e;
    --text:      #1e1a14;
    --muted:     #8a7f6e;
    --highlight: #e8f4f0;
    --row-odd:   #faf8f4;
    --row-even:  #f0ede5;
    --shadow:    0 4px 24px rgba(30,26,20,0.10);
  }
 
  * { box-sizing: border-box; margin: 0; padding: 0; }
 
  body {
    background: var(--bg);
    color: var(--text);
    font-family: 'Noto Sans JP', sans-serif;
    min-height: 100vh;
    padding: 32px 16px 64px;
  }
 
  /* ── ヘッダー ── */
  header {
    text-align: center;
    margin-bottom: 40px;
  }
  header h1 {
    font-family: 'Noto Serif JP', serif;
    font-size: clamp(1.4rem, 4vw, 2rem);
    font-weight: 700;
    letter-spacing: 0.12em;
    color: var(--accent);
    margin-bottom: 6px;
  }
  header p {
    font-size: 0.82rem;
    color: var(--muted);
    letter-spacing: 0.05em;
  }
  .divider {
    width: 60px; height: 2px;
    background: linear-gradient(90deg, var(--accent), var(--accent2));
    margin: 14px auto 0;
    border-radius: 2px;
  }
 
  /* ── レイアウト ── */
  .container {
    max-width: 900px;
    margin: 0 auto;
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 28px;
    align-items: start;
  }
  @media (max-width: 680px) {
    .container { grid-template-columns: 1fr; }
  }
  .container.exam-mode {
    grid-template-columns: 1fr;
  }
  .container.exam-mode .list-card {
    display: none;
  }
  .container.exam-mode .exam-card {
    position: static;
    max-width: 560px;
    margin: 0 auto;
    width: 100%;
  }
 
  /* ── カード共通 ── */
  .card {
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: 12px;
    box-shadow: var(--shadow);
    overflow: hidden;
  }
  .card-header {
    display: flex;
    align-items: center;
    gap: 10px;
    padding: 16px 20px 14px;
    border-bottom: 1px solid var(--border);
    background: linear-gradient(135deg, #f7f4ee 0%, #eee9de 100%);
  }
  .card-header .badge {
    display: inline-flex;
    align-items: center;
    justify-content: center;
    width: 28px; height: 28px;
    border-radius: 50%;
    font-size: 0.8rem;
    font-weight: 700;
    flex-shrink: 0;
  }
  .badge-green  { background: var(--accent);  color: #fff; }
  .badge-brown  { background: var(--accent2); color: #fff; }
  .card-header h2 {
    font-family: 'Noto Serif JP', serif;
    font-size: 0.95rem;
    font-weight: 600;
    letter-spacing: 0.06em;
  }
  .card-body { padding: 0; }
 
  /* ── データ一覧テーブル ── */
  .data-table {
    width: 100%;
    border-collapse: collapse;
    font-size: 0.78rem;
  }
  .data-table thead th {
    padding: 8px 12px;
    text-align: left;
    font-size: 0.72rem;
    font-weight: 500;
    color: var(--muted);
    letter-spacing: 0.06em;
    background: #f0ede5;
    border-bottom: 1px solid var(--border);
  }
  .data-table tbody tr:nth-child(odd)  { background: var(--row-odd); }
  .data-table tbody tr:nth-child(even) { background: var(--row-even); }
  .data-table tbody tr:hover { background: var(--highlight); }
  .data-table td {
    padding: 5px 12px;
    border-bottom: 1px solid #e8e4da;
    vertical-align: middle;
  }
  .td-num  { width: 40px; color: var(--muted); font-size: 0.7rem; text-align: right; padding-right: 8px; }
  .td-bone { font-weight: 500; color: var(--accent); }
  .td-part { color: var(--text); }
 
  /* スクロール領域 */
  .table-scroll { max-height: 340px; overflow-y: auto; }
  .table-scroll::-webkit-scrollbar { width: 5px; }
  .table-scroll::-webkit-scrollbar-track { background: #f0ede5; }
  .table-scroll::-webkit-scrollbar-thumb { background: var(--border); border-radius: 3px; }
 
  /* カテゴリタブ */
  .cat-tabs {
    display: flex;
    flex-wrap: wrap;
    gap: 6px;
    padding: 12px 16px 0;
    background: #f7f4ee;
    border-bottom: 1px solid var(--border);
  }
  .cat-tab {
    padding: 4px 12px;
    border-radius: 20px;
    font-size: 0.72rem;
    font-weight: 500;
    cursor: pointer;
    border: 1px solid var(--border);
    background: var(--surface);
    color: var(--muted);
    transition: all 0.18s;
  }
  .cat-tab.active {
    background: var(--accent);
    color: #fff;
    border-color: var(--accent);
  }
  .cat-tab:hover:not(.active) { background: var(--highlight); }
 
  /* ── タイマー設定エリア ── */
  .timer-setting {
    margin: 14px 16px 0;
    padding: 12px 14px;
    background: #f0ede5;
    border: 1px solid var(--border);
    border-radius: 8px;
  }
  .timer-setting label {
    display: block;
    font-size: 0.75rem;
    font-weight: 500;
    color: var(--muted);
    margin-bottom: 8px;
    letter-spacing: 0.05em;
  }
  .timer-inputs {
    display: flex;
    align-items: center;
    gap: 6px;
    flex-wrap: wrap;
  }
  .timer-inputs span {
    font-size: 0.8rem;
    color: var(--muted);
  }
  .timer-input {
    width: 56px;
    padding: 5px 8px;
    border: 1px solid var(--border);
    border-radius: 6px;
    font-size: 0.9rem;
    font-family: 'Noto Sans JP', sans-serif;
    text-align: center;
    background: var(--surface);
    color: var(--text);
  }
  .timer-input:focus {
    outline: none;
    border-color: var(--accent);
    box-shadow: 0 0 0 2px rgba(42,95,79,0.15);
  }
  .timer-preview {
    font-size: 0.72rem;
    color: var(--accent);
    font-weight: 600;
    margin-left: 4px;
  }
 
  /* ── 試験パネル（右カラム） ── */
  .exam-card {
    position: sticky;
    top: 20px;
  }
 
  /* ボタン共通 */
  .btn {
    display: block;
    width: calc(100% - 32px);
    margin: 14px auto;
    padding: 14px 0;
    border: none;
    border-radius: 8px;
    font-family: 'Noto Serif JP', serif;
    font-size: 1rem;
    font-weight: 600;
    letter-spacing: 0.12em;
    cursor: pointer;
    transition: all 0.2s;
  }
  .btn:hover  { transform: translateY(-1px); }
  .btn:active { transform: translateY(0); }
 
  .btn-select {
    background: linear-gradient(135deg, var(--accent) 0%, #1e4a3b 100%);
    color: #fff;
    box-shadow: 0 3px 12px rgba(42,95,79,0.35);
  }
  .btn-select:hover { box-shadow: 0 6px 18px rgba(42,95,79,0.45); }
 
  .btn-exam {
    background: linear-gradient(135deg, var(--accent2) 0%, #5a3a1a 100%);
    color: #fff;
    box-shadow: 0 3px 12px rgba(122,79,42,0.35);
  }
  .btn-exam:hover { box-shadow: 0 6px 18px rgba(122,79,42,0.45); }
 
  .btn-stop {
    background: linear-gradient(135deg, var(--danger) 0%, #7b2819 100%);
    color: #fff;
    box-shadow: 0 3px 12px rgba(176,58,46,0.35);
    display: none;
  }
  .btn-stop:hover { box-shadow: 0 6px 18px rgba(176,58,46,0.45); }
 
  /* ── タイマー表示 ── */
  .timer-display {
    display: none;
    text-align: center;
    padding: 14px 0 4px;
  }
  .timer-display .timer-label {
    font-size: 0.7rem;
    color: var(--muted);
    letter-spacing: 0.08em;
    margin-bottom: 4px;
  }
  .timer-display .timer-clock {
    font-family: 'Noto Serif JP', serif;
    font-size: 2.6rem;
    font-weight: 700;
    letter-spacing: 0.06em;
    color: var(--accent);
    line-height: 1;
  }
  .timer-display .timer-clock.warning { color: #c0782a; }
  .timer-display .timer-clock.danger  { color: var(--danger); animation: pulse 0.8s infinite; }
  @keyframes pulse {
    0%, 100% { opacity: 1; }
    50%       { opacity: 0.5; }
  }
  .timer-display.running { display: block; }
 
  /* ── 問題リスト ── */
  #quiz-area {
    padding: 0 16px 8px;
    min-height: 80px;
  }
  .quiz-placeholder {
    text-align: center;
    color: var(--muted);
    font-size: 0.82rem;
    padding: 24px 0 8px;
    letter-spacing: 0.04em;
  }
  .quiz-meta {
    display: flex;
    justify-content: space-between;
    align-items: center;
    font-size: 0.72rem;
    color: var(--muted);
    letter-spacing: 0.05em;
    margin-bottom: 10px;
    padding-top: 12px;
  }
  .quiz-meta .total { font-weight: 600; color: var(--accent); }
 
  .quiz-item {
    display: grid;
    grid-template-columns: 28px 1fr;
    gap: 8px;
    align-items: center;
    padding: 9px 10px;
    margin-bottom: 5px;
    border-radius: 8px;
    background: var(--row-odd);
    animation: slideIn 0.3s ease both;
  }
  .quiz-item:nth-child(odd)  { background: var(--row-odd);  }
  .quiz-item:nth-child(even) { background: var(--row-even); }
  @keyframes slideIn {
    from { opacity: 0; transform: translateX(12px); }
    to   { opacity: 1; transform: translateX(0); }
  }
  .quiz-item .q-num {
    display: flex;
    align-items: center;
    justify-content: center;
    width: 22px; height: 22px;
    border-radius: 50%;
    background: var(--accent);
    color: #fff;
    font-size: 0.65rem;
    font-weight: 700;
    flex-shrink: 0;
  }
  .quiz-item .q-content {
    display: flex;
    align-items: baseline;
    flex-wrap: wrap;
    gap: 0 10px;
  }
  .quiz-item .q-no {
    font-size: 0.78rem;
    font-weight: 600;
    color: var(--muted);
    white-space: nowrap;
  }
  .quiz-item .q-bone {
    font-weight: 400;
    font-size: 0.9rem;
    color: var(--accent);
    letter-spacing: 0.02em;
    white-space: nowrap;
  }
  .quiz-item .q-part {
    font-weight: 700;
    font-size: 0.9rem;
    color: var(--text);
    white-space: nowrap;
  }
 
  /* ── フッター ── */
  .footer-note {
    text-align: center;
    font-size: 0.7rem;
    color: var(--muted);
    margin-top: 32px;
    letter-spacing: 0.05em;
  }
</style>
</head>
<body>
 
<header>
  <h1>骨学口頭試問システム</h1>
  <p>解剖学 ／ 骨学口頭試問データ</p>
  <div class="divider"></div>
</header>
 
<div class="container">
 
  <!-- 左：データ一覧 -->
  <div class="card list-card">
    <div class="card-header">
      <span class="badge badge-green">覧</span>
      <h2>骨名称 一覧表（カテゴリ別）</h2>
    </div>
    <div class="cat-tabs" id="cat-tabs"></div>
    <div class="card-body">
      <div class="table-scroll">
        <table class="data-table" id="data-table">
          <thead>
            <tr>
              <th class="td-num">番号</th>
              <th>骨名</th>
              <th>部位名</th>
            </tr>
          </thead>
          <tbody id="table-body"></tbody>
        </table>
      </div>
    </div>
 
    <!-- タイマー時間設定（ホーム画面） -->
    <div class="timer-setting">
      <label>⏱ タイマー時間の設定</label>
      <div class="timer-inputs">
        <input type="number" class="timer-input" id="timer-min" value="5" min="0" max="59" oninput="updateTimerPreview()">
        <span>分</span>
        <input type="number" class="timer-input" id="timer-sec" value="0" min="0" max="59" oninput="updateTimerPreview()">
        <span>秒</span>
        <span class="timer-preview" id="timer-preview">（合計 5:00）</span>
      </div>
    </div>
 
    <!-- 問題選択ボタン -->
    <button class="btn btn-select" onclick="selectQuestions()">試験問題選択</button>
  </div>
 
  <!-- 右：試験パネル -->
  <div class="card exam-card">
    <div class="card-header">
      <span class="badge badge-brown">試</span>
      <h2>口頭試問 — ランダム出題</h2>
    </div>
 
    <!-- タイマー表示（試験中） -->
    <div class="timer-display" id="timer-display">
      <div class="timer-label">試験時間</div>
      <div class="timer-clock" id="timer-clock">0:00</div>
    </div>
 
    <!-- 試験開始ボタン（問題選択後に表示） -->
    <button class="btn btn-exam" id="btn-exam-start" style="display:none" onclick="startExam()">試験開始</button>
 
    <!-- 試験停止ボタン（計測中に表示） -->
    <button class="btn btn-stop" id="btn-stop" onclick="stopExam()">試験を終了する</button>
 
    <div id="quiz-area">
      <p class="quiz-placeholder">「試験問題選択」を押すと<br>各カテゴリから2問ずつ、計10問を出題します</p>
    </div>
  </div>
 
</div>
 
<p class="footer-note">各カテゴリ 2問 × 5カテゴリ ＝ 計10問 ／ 同一問題は重複しません</p>

  }

let timerInterval = null;
let timerRemaining = 0;
 
// ── タイマープレビュー更新 ────────────────────────────────────────
function updateTimerPreview() {
  const m = parseInt(document.getElementById('timer-min').value) || 0;
  const s = parseInt(document.getElementById('timer-sec').value) || 0;
  document.getElementById('timer-preview').textContent =
    `（合計 ${m}:${String(s).padStart(2,'0')}）`;
}
 
// ── タブ生成 ──────────────────────────────────────────────────────
function buildTabs() {
  const tabs = document.getElementById('cat-tabs');
  CATEGORIES.forEach((cat, i) => {
    const btn = document.createElement('button');
    btn.className = 'cat-tab' + (i === 0 ? ' active' : '');
    btn.textContent = cat.name;
    btn.onclick = () => {
      document.querySelectorAll('.cat-tab').forEach(t => t.classList.remove('active'));
      btn.classList.add('active');
      renderTable(i);
    };
    tabs.appendChild(btn);
  });
}
 
// ── テーブル描画 ──────────────────────────────────────────────────
function renderTable(catIdx) {
  const tbody = document.getElementById('table-body');
  tbody.innerHTML = '';
  CATEGORIES[catIdx].data.forEach(([num, bone, part]) => {
    const tr = document.createElement('tr');
    tr.innerHTML = `
      <td class="td-num">${num}</td>
      <td class="td-bone">${bone}</td>
      <td class="td-part">${part}</td>`;
    tbody.appendChild(tr);
  });
}
 
// ── ランダム選択（重複なし） ──────────────────────────────────────
function pickRandom(arr, n) {
  const copy = [...arr];
  const result = [];
  while (result.length < n && copy.length > 0) {
    const idx = Math.floor(Math.random() * copy.length);
    result.push(copy.splice(idx, 1)[0]);
  }
  return result;
}
 
// ── 試験問題選択 ──────────────────────────────────────────────────
function selectQuestions() {
  // 一覧を隠して試験パネルを全幅に
  document.querySelector('.container').classList.add('exam-mode');
 
  const area = document.getElementById('quiz-area');
  area.innerHTML = '';
 
  const allPicked = [];
  CATEGORIES.forEach((cat, ci) => {
    pickRandom(cat.data, 2).forEach(row =>
      allPicked.push({ row, catIdx: ci })
    );
  });
  // シャッフル
  for (let i = allPicked.length - 1; i > 0; i--) {
    const j = Math.floor(Math.random() * (i + 1));
    [allPicked[i], allPicked[j]] = [allPicked[j], allPicked[i]];
  }
 
  // メタ行
  const meta = document.createElement('div');
  meta.className = 'quiz-meta';
  meta.innerHTML = `<span>出題リスト</span><span class="total">全 ${allPicked.length} 問</span>`;
  area.appendChild(meta);
 
  // 各問
  allPicked.forEach(({ row, catIdx }, qIdx) => {
    const [num, bone, part] = row;
    const item = document.createElement('div');
    item.className = 'quiz-item';
    item.style.animationDelay = `${qIdx * 0.05}s`;
    item.innerHTML = `
      <div class="q-num">${qIdx + 1}</div>
      <div class="q-content">
        <span class="q-no">No.${num}</span>
        <span class="q-bone">${bone}</span>
        <span class="q-part">${part}</span>
      </div>`;
    area.appendChild(item);
  });
 
  // 「試験開始」ボタンを表示、タイマーは非表示
  document.getElementById('btn-exam-start').style.display = 'block';
  document.getElementById('btn-stop').style.display = 'none';
  document.getElementById('timer-display').classList.remove('running');
  if (timerInterval) { clearInterval(timerInterval); timerInterval = null; }
}
 
// ── 試験開始（タイマースタート） ─────────────────────────────────
function startExam() {
  const m = parseInt(document.getElementById('timer-min').value) || 0;
  const s = parseInt(document.getElementById('timer-sec').value) || 0;
  timerRemaining = m * 60 + s;
 
  if (timerRemaining <= 0) {
    alert('タイマーの時間を設定してください（ホーム画面の「タイマー時間の設定」）');
    return;
  }
 
  document.getElementById('btn-exam-start').style.display = 'none';
  document.getElementById('btn-stop').style.display = 'block';
  document.getElementById('timer-display').classList.add('running');
 
  updateClock();
  timerInterval = setInterval(() => {
    timerRemaining--;
    updateClock();
    if (timerRemaining <= 0) {
      clearInterval(timerInterval);
      timerInterval = null;
      document.getElementById('timer-clock').textContent = '終了';
      document.getElementById('timer-clock').className = 'timer-clock danger';
      document.getElementById('btn-stop').style.display = 'none';
      setTimeout(returnHome, 1500);
    }
  }, 1000);
}
 
// ── 時計表示更新 ──────────────────────────────────────────────────
function updateClock() {
  const m = Math.floor(timerRemaining / 60);
  const s = timerRemaining % 60;
  const clock = document.getElementById('timer-clock');
  clock.textContent = `${m}:${String(s).padStart(2,'0')}`;
  // 残り30秒以下で色変化
  if (timerRemaining <= 10)       clock.className = 'timer-clock danger';
  else if (timerRemaining <= 30)  clock.className = 'timer-clock warning';
  else                            clock.className = 'timer-clock';
}
 
// ── 試験終了 ──────────────────────────────────────────────────────
function stopExam() {
  if (timerInterval) { clearInterval(timerInterval); timerInterval = null; }
  returnHome();
}
 
// ── ホーム画面に戻る ──────────────────────────────────────────────
function returnHome() {
  // タイマー・ボタンをリセット
  document.getElementById('btn-stop').style.display = 'none';
  document.getElementById('btn-exam-start').style.display = 'none';
  document.getElementById('timer-display').classList.remove('running');
  document.getElementById('timer-clock').textContent = '0:00';
  document.getElementById('timer-clock').className = 'timer-clock';
 
  // 問題リストをクリアしてプレースホルダーを戻す
  const area = document.getElementById('quiz-area');
  area.innerHTML = '<p class="quiz-placeholder">「試験問題選択」を押すと<br>各カテゴリから2問ずつ、計10問を出題します</p>';
 
  // 一覧パネルを再表示
  document.querySelector('.container').classList.remove('exam-mode');
}
 
// ── 初期化 ────────────────────────────────────────────────────────
buildTabs();
renderTable(0);
updateTimerPreview();
</script>
